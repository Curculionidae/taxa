# Placement rules for the country checklists.
#
# What this file is for
#   The checklist build decides, for every asserted distribution, specimen and
#   field occurrence, which country checklist it belongs to. Most decisions come
#   straight from TaxonWorks. This file holds everything TaxonWorks cannot say:
#   checklists of their own, spelling variants of country names, and what to do
#   with areas whose country is not stated. The file is compiled by
#   modules/checklists/placement/rules.js. Every explanation of a decision cites
#   the line of the rule that made it, as placement.yml:<line>.
#
# The three sources of a decision (shown in square brackets in explanations)
#   [TaxonWorks]  what TaxonWorks says: the country of a political area, the ISO
#                 code of a gazetteer, the DwC country and stateProvince of a specimen.
#   (Natural Earth is geometry only: country and state outlines. No name from it
#                 decides anything; its state aliases are not read.)
#   [manual]      a line in this file written by hand (manual section, checklists,
#                 synonyms, parts, ignored_name_words, coastal_tolerance_degrees).
#   [overlap]     a line in the overlap section: which country outlines the shape
#                 of an area falls in, measured on the cached shapes.
#   Manual lines win over overlap lines.
#
# The overlap section is written by the measuring script (npm run
# checklists:measure, see the module README, "Measuring overlap"). It appends
# rules at the end of the section and never changes other lines. Do not edit it
# by hand, except to delete a line (the next run measures that area again). To
# overrule a line, add a manual rule for the same area instead.
#
# Keys
#   checklists  Checklists of their own that TaxonWorks files under another country.
#     name   checklist name, shown on the page
#     iso2   ISO 3166-1 alpha-2 code; gazetteers carrying it belong here
#     of     the country TaxonWorks files it under (optional)
#     areas  area ids that belong to it, GA = geographic area, GZ = gazetteer
#     names  words in a DwC country, province or place that name it
#     box    rough bounding box [west, south, east, north], used where no outline is cached
#     outline  natural_earth: take the checklist's outline from the Natural Earth
#            outlines (public/checklists/fallback-shapes.geojson) even when an
#            area of it has a cached outline (optional)
#     why    the reason this checklist exists
#     Example: { name: Mayotte, iso2: YT, of: France, names: [Mayotte], box: [...], why: ... }
#   coastal_tolerance_degrees  A point outside every outline but this close to
#               one (in degrees) counts for that outline, as a coastal point.
#   synonyms    Different spellings of one country. The first name is the checklist name.
#     Example: [Tanzania, United Republic of Tanzania]
#   parts       Parts of a country that can be selected on their own, by country name.
#     name   part name
#     areas  area ids that belong to it
#     names  words in a province or place that name it
#     box    rough bounding box, as above
#     rest   true on the part that takes every other record below country level
#     Example: Corsica under France
#   manual, overlap  Rules for one area each.
#     match   which area: area ("GA 78" or "GZ 10453"), tdwg (TDWG code),
#             gazetteer_prefix (start of a gazetteer name), iso2 (ISO code)
#     subdivision_of   the area is a part of a country: { country, part?, state? }
#     synonymous_with  the area is the same as another area, given as "GA 78"
#     not_placeable    the area has no single country; the text is the reason
#       not_placeable: spans several states   speaks about the state only: the
#                      area lies in one country but in several of its states, so
#                      its records get no state. Such a rule never decides the
#                      country; another rule or TaxonWorks does.
#     Exactly one of the three actions per rule.
#     why       the reason, for manual rules
#     measured  the measurement, for overlap rules: the top four shares and the
#               date; its first percentage is kept. A share of 90% or more gives
#               subdivision_of, less gives not_placeable.
#     Example: { match: { tdwg: 12SPA }, subdivision_of: { country: Spain } }
#     Example of a state rule: { match: { area: "GZ 10453" },
#               subdivision_of: { country: United States, state: Hawaii } }

checklists:
  # Own checklists although TaxonWorks files them under France (ISO 3166-1 codes)
  - name: French Guiana
    iso2: GF
    of: France
    names: [French Guiana, Guyane]
    areas: [GA 32253, GA 78, GA 34200]   # Natural Earth state, country-level area, TDWG L4
    box: [-55, 1.8, -51, 6.2]
    why: ISO 3166-1 code GF of its own, though TaxonWorks files it under France
  - name: Guadeloupe
    iso2: GP
    of: France
    names: [Guadeloupe]
    areas: [GA 90, GA 32432, GA 34212]   # as in public/checklists/index.json, so country files keep their names
    box: [-62, 15.7, -60.8, 16.6]
    why: ISO 3166-1 code GP of its own, though TaxonWorks files it under France
  - name: Martinique
    iso2: MQ
    of: France
    names: [Martinique]
    areas: [GA 32213, GA 34557]   # as in public/checklists/index.json, so country files keep their names
    box: [-61.3, 14.3, -60.7, 15]
    why: ISO 3166-1 code MQ of its own, though TaxonWorks files it under France
  - name: Réunion
    iso2: RE
    of: France
    names: [Réunion, Reunion]
    areas: [GA 33048]   # as in public/checklists/index.json, so country files keep their names
    box: [55.1, -21.5, 56, -20.8]
    why: ISO 3166-1 code RE of its own, though TaxonWorks files it under France
  - name: Mayotte
    iso2: YT
    of: France
    names: [Mayotte]
    areas: [GA 34156]   # as in public/checklists/index.json, so country files keep their names
    box: [44.9, -13.1, 45.4, -12.5]
    why: ISO 3166-1 code YT of its own, though TaxonWorks files it under France
  - name: Northern Mariana Islands
    iso2: MP
    areas: [GA 31750]   # the TaxonWorks country area; no record uses it, so its outline is not cached
    why: 31 records on Northern Mariana Islands gazetteers had no checklist (test report 2026-11-20)
  - name: Kosovo
    iso2: XK
    why: own checklist by user decision 2026-11-20 (XK is the user-assigned code in common use)
  - name: Norfolk Island
    iso2: NF
    areas: [GA 33700, GZ 10458]   # TDWG Norfolk Is. (50NFK); gazetteer "Australia: Norfolk Island" (ISO AU)
    outline: natural_earth   # the TDWG outline of 50NFK also covers Lord Howe Island, which stays Australia (manual rule for 50NFK-LH)
    why: own checklist by user decision 2026-11-20

# Checklists that can be browsed by state or province. Their records get a
# state, and the page shows a state drill-down. The state names and outlines
# come from Natural Earth (public/checklists/subdivisions.geojson, features
# whose country is the checklist name; their aliases are not used).
state_countries: [United States, Canada, Australia, China, Russia]

synonyms:
  # Several country-level areas in TaxonWorks, spelled differently
  - [Bosnia and Herzegovina, Bosnia and Herz.]
  - [Cayman Islands, Cayman Is.]
  - [North Korea, Dem. Rep. Korea]
  - [South Korea, Korea]
  - [Equatorial Guinea, Eq. Guinea]
  - [Faroe Islands, Faeroe Is.]
  - [Laos, Lao PDR]
  - [North Macedonia, Macedonia]
  - [Sao Tome and Principe, São Tomé and Principe]
  - [Solomon Islands, Solomon Is.]
  - [Saint Kitts and Nevis, St. Kitts and Nevis]
  - ["Saint Vincent and the Grenadines", St. Vin. and Gren.]
  - ["Virgin Islands, U.S.", U.S. Virgin Is.]
  - [Tanzania, United Republic of Tanzania]
  - [Vietnam, Viet Nam]
  - [Saint Martin, Saint Martin (French part)]
  - [Western Sahara, W. Sahara]
  - [Turks and Caicos Islands, Turks and Caicos Is.]
  - [French Southern Territories, TAAF]
  - [United States, United States of America]   # GA 33412 (Natural Earth), parent of the US states
  # Spellings of TaxonWorks' DwC country text (test report 2026-11-20)
  - [Congo, Republic of Congo]
  - ["Côte d'Ivoire", Ivory Coast]
  # TaxonWorks spells GA 186 with a capital É; the checklist keeps the usual spelling
  - [Saint Barthélemy, Saint BarthÉlemy]

# Words left out when a place name is compared with the state names of a
# checklist, so that "Krasnoyarsk Krai" finds the state Krasnoyarsk and
# "Republic of Sakha" finds Sakha. They apply only to states, never to country
# names. Case and accents do not matter. An explanation that needed them says
# which words it ignored and cites this line.
ignored_name_words: [province, oblast, krai, kray, republic, of, autonomous, region, okrug, state, municipality, city, district, territory, sheng, shi, the, and, county]

# Coastlines of the cached outlines are simplified, so specimens collected on
# the shore often lie a few hundred metres outside them. A point outside every
# outline but within this many degrees (0.05 degrees, about 5 km) of one
# counts for the nearest outline, unless a second one is nearly as close; the
# step then says "within about 5 km of the coast of".
coastal_tolerance_degrees: 0.05

parts:
  France:
    - name: Corsica
      areas: [GA 32254]
      names: [Corse, Corsica]
      box: [8.4, 41.3, 9.7, 43.1]
    - name: Mainland France
      areas: [GA 34185]   # TDWG L4 12FRA-FR, mainland only: its outline has no Channel Islands (12FRA has)
      rest: true
      box: [-5.5, 42.2, 8.3, 51.2]
manual:
  # TDWG areas where geometry alone would mislead
  - match: { tdwg: 12FRA }
    subdivision_of: { country: France, part: Mainland France }
    why: approximately; TDWG France also covers Jersey and Guernsey
  - match: { tdwg: 10IRE-NI }
    subdivision_of: { country: United Kingdom }
    why: TaxonWorks DwC says Ireland (its name match climbs to TDWG Ireland)
  - match: { tdwg: 50NFK-LH }
    subdivision_of: { country: Australia }
    why: Lord Howe Island belongs to New South Wales; its TDWG parent 50NFK is the Norfolk Island checklist
  # Areas whose cached TaxonWorks outline is wrong
  - match: { area: GA 20379 }
    subdivision_of: { country: Russia, state: Chukchi Autonomous Okrug }
    why: the cached TaxonWorks outline of Chukot also covers Yakutia; fix the shape in TaxonWorks
  # Areas on a border
  - match: { area: GZ 10572 }
    not_placeable: lies on the border of Czech Republic and Poland
    why: user decision 2026-11-20, to be reviewed
  # Gazetteers with a wrong ISO code
  - match: { gazetteer_prefix: "TAAF:" }
    subdivision_of: { country: French Southern Territories }
    why: TAAF gazetteers carry ISO code FR in TaxonWorks but lie in the French Southern Territories (ISO TF)

